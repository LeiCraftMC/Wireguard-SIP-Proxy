[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
OUTBOUND_TRUNK=PJSIP/realtrunk-endpoint
PBX_TRUNK=PJSIP/pbx-endpoint

; PBX -> real SIP trunk
[from-pbx]
exten => _X.,1,NoOp(B2BUA from PBX to real trunk. CallerID=${CALLERID(all)})
 same => n,Dial(${OUTBOUND_TRUNK}/${EXTEN},90,b(add-pai^s^1))
 same => n,Hangup()

; real SIP trunk -> PBX
[from-realtrunk]
exten => _X.,1,NoOp(B2BUA from real trunk to PBX. CallerID=${CALLERID(all)})
 same => n,Dial(${PBX_TRUNK}/${EXTEN},90,b(add-pai^s^1))
 same => n,Hangup()

; Dialplan helper to preserve or set P-Asserted-Identity on the outbound leg.
[add-pai]
exten => s,1,Set(__PAI_IN=${PJSIP_HEADER(read,P-Asserted-Identity)})
 same => n,ExecIf($["${PAI_IN}" = ""]?Set(__PAI_IN=<sip:${CALLERID(num)}@asterisk.local>))
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=${PAI_IN})
 same => n,Return()
