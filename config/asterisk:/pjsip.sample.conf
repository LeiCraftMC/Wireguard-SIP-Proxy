[global]
type=global
user_agent=WG-B2BUA-Asterisk

; This transport listens for your PBX and the real SIP trunk.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =====================================================================
; TRUNK A: Your PBX -> this Asterisk (incoming and outgoing)
; =====================================================================
[pbx-aor]
type=aor
contact=sip:YOUR_PBX_IP:5060

[pbx-auth]
type=auth
auth_type=userpass
username=YOUR_PBX_TRUNK_USER
password=YOUR_PBX_TRUNK_PASSWORD

[pbx-endpoint]
type=endpoint
transport=transport-udp
context=from-pbx
disallow=all
allow=alaw,ulaw
aors=pbx-aor
auth=pbx-auth
outbound_auth=pbx-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
identify_by=ip,username
send_pai=yes
trust_id_inbound=yes
trust_id_outbound=yes

[pbx-identify]
type=identify
endpoint=pbx-endpoint
match=YOUR_PBX_IP

; =====================================================================
; TRUNK B: Asterisk -> real SIP trunk (must route over WireGuard)
; =====================================================================
[realtrunk-reg]
type=registration
transport=transport-udp
outbound_auth=realtrunk-auth
server_uri=sip:REAL_TRUNK_FQDN_OR_IP
client_uri=sip:REAL_TRUNK_USERNAME@REAL_TRUNK_FQDN_OR_IP
retry_interval=60
expiration=300
line=yes

[realtrunk-auth]
type=auth
auth_type=userpass
username=REAL_TRUNK_USERNAME
password=REAL_TRUNK_PASSWORD

[realtrunk-aor]
type=aor
contact=sip:REAL_TRUNK_FQDN_OR_IP:5060
qualify_frequency=30

[realtrunk-endpoint]
type=endpoint
transport=transport-udp
context=from-realtrunk
disallow=all
allow=alaw,ulaw
aors=realtrunk-aor
outbound_auth=realtrunk-auth
from_user=REAL_TRUNK_USERNAME
from_domain=REAL_TRUNK_FQDN_OR_IP
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
timers=yes
send_pai=yes
send_rpid=yes
trust_id_inbound=yes
trust_id_outbound=yes

[realtrunk-identify]
type=identify
endpoint=realtrunk-endpoint
match=REAL_TRUNK_IP_OR_SBC_IP